name: daily-collect

on:
  schedule:
    # 매일 08:10 KST (= 23:10 UTC) — 전일 하루치 여론 수집
    - cron: "10 23 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "수집 대상 날짜 (YYYY-MM-DD, 비우면 어제)"
        required: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (LLM 요약용 — 키 없으면 없어도 무방)
        run: pip install anthropic

      - name: Collect
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/collect.py --date "${{ github.event.inputs.date }}"
          else
            python scripts/collect.py
          fi

      - name: Commit & push
        run: |
          git config user.name "issue-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "data: $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M KST') 수집"
          git push
